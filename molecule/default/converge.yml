---
- name: Converge
  hosts: all
  # become: true

  vars:
    certbot_auto_renew_user: root

  pre_tasks:
    - name: Update apt cache.
      apt: update_cache=yes cache_valid_time=600
      when: ansible_facts.os_family == 'Debian'
      changed_when: false

    - name: Install dependencies (RedHat).
      yum:
        name: epel-release
        state: present
      when: ansible_facts.os_family == 'RedHat'

  roles:
    - geerlingguy.certbot
